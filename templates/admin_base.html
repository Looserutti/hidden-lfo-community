{% extends 'base.html' %}
{% block head %}<link rel="stylesheet" href="/static/admin.css?v=event-stats2">{% endblock %}
{% block content %}
<div class="admin-shell">
  <nav class="admin-nav" aria-label="Administration">
    <a class="admin-brand" href="/admin">{{ site.name }} <span>ADMIN</span></a>
    <div class="admin-nav-links">
      <a href="/admin" {% if request.url.path == '/admin' %}aria-current="page"{% endif %}>Overview &amp; events</a>
      <a href="/admin/activity" {% if request.url.path == '/admin/activity' %}aria-current="page"{% endif %}>Member activity</a>
      <a href="/admin/settings" {% if request.url.path == '/admin/settings' %}aria-current="page"{% endif %}>Calendar settings</a>
      <a href="/admin/music" {% if request.url.path == '/admin/music' %}aria-current="page"{% endif %}>Gallery audio</a>
      <a href="/">View website ↗</a>
    </div>
  </nav>
  {% block admin_content %}{% endblock %}
</div>
{% endblock %}
