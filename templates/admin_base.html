{% extends 'base.html' %}
{% block head %}<link rel="stylesheet" href="/static/admin.css?v=control-hub1"><script src="/static/admin-ui.js?v=1" defer></script>{% endblock %}
{% block content %}
<div class="admin-shell admin-workspace">
<aside class="admin-sidebar" aria-label="Admin sections"><a class="admin-brand" href="/admin">{{ site.name }} <span>ADMIN</span></a>
<a class="admin-hub-link" href="/admin" {% if admin_section == 'hub' %}aria-current="page"{% endif %}>Control hub</a>
<div class="admin-desktop-navigation">{% include '_admin_links.html' %}</div>
<details class="admin-mobile-navigation"><summary>Switch section <span aria-hidden="true">⌄</span></summary>{% include '_admin_links.html' %}</details>
</aside>
<div class="admin-main">{% block admin_content %}{% endblock %}</div>
</div>
{% endblock %}
