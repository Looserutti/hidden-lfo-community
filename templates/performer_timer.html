<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.event_manager_name }} · Set timer</title>
<style>
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #141414; color: #fff; font-family: system-ui, sans-serif; text-align: center; }
main { padding: 1rem; }
#clock { font-size: clamp(4rem, 20vw, 13rem); font-variant-numeric: tabular-nums; line-height: 1.1; }
.amber { color: #ffc452; }
.red { color: #ff7777; }
</style>
<main>
<h1>Set timer</h1>
<div id="clock" data-state-url="/meetups/{{ event_id }}/timer/state">–:––</div>
<p id="status" role="status">Connecting…</p>
</main>
<script src="/static/performer_timer.js" type="module"></script>
</html>
