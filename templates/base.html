<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Hidden LFO</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header><a href="/">Hidden LFO</a>
        <nav><a href="/">Events</a> <a href="/calendar">Calendar</a> {% if is_admin %}<a href="/admin">Admin</a>{% endif
            %} {% if user_id %}<form action="/logout" method="post"><input type="hidden" name="csrf"
                    value="{{ csrf }}"><button>Sign out</button></form>{% else %}<a href="/login">Admin sign in</a>{%
            endif %}</nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>Event registration takes place inside our Discord server.</footer>
    <script src="/static/local-time.js" defer></script>
</body>

</html>
